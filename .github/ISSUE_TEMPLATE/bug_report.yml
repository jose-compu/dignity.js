name: Bug report
description: Report something that is broken or incorrect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search [existing issues](https://github.com/jose-compu/dignity.js/issues) first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dignity.js version
      placeholder: e.g. 0.8.3 or main @ commit sha
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22 / Chrome 124 / macOS, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell
