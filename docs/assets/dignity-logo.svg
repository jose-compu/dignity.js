<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dignity.js">
  <!-- Bauhaus-inspired wordmark: primary geometry + functional sans typography -->
  <rect width="300" height="80" rx="8" fill="#F2EDE4"/>
  <rect x="1" y="1" width="298" height="78" rx="7" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Emblem: circle · triangle · square with P2P connector -->
  <g transform="translate(12 12)">
    <circle cx="16" cy="16" r="14" fill="#005CB8"/>
    <path d="M30 6 L44 34 L16 34 Z" fill="#F5C400"/>
    <rect x="26" y="26" width="22" height="22" fill="#1A8F3C"/>
    <line x1="16" y1="16" x2="37" y2="37" stroke="#0A0A0A" stroke-width="3" stroke-linecap="square"/>
  </g>

  <text
    x="88"
    y="50"
    font-family="'Futura', 'Avenir Next', 'Helvetica Neue', 'Arial Narrow', Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.5"
  >
    <tspan fill="#0A0A0A">dignity</tspan><tspan fill="#005CB8">.js</tspan>
  </text>

  <rect x="88" y="58" width="178" height="3" fill="#1A8F3C"/>
</svg>
