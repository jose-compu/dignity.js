<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dignity Apps error panel e2e fixture</title>
  </head>
  <body>
    <div id="host-mount"></div>
    <pre id="error-panel-visible">false</pre>
    <pre id="error-count">0</pre>
    <pre id="status">pending</pre>
    <script type="module">
      import dignity from '../assets/dignity.esm.js';

      const {
        DignityP2P,
        DignityQueryReplica,
        DignityAppHost,
        attachErrorPanel,
        validateDignityAppManifest,
        InMemoryNetworkHub,
        InMemoryNetworkAdapter
      } = dignity;

      const statusEl = document.getElementById('status');

      function fail(message) {
        statusEl.textContent = `error: ${message}`;
        throw new Error(message);
      }

      try {
        const hub = new InMemoryNetworkHub();
        const security = {
          appPassword: 'browser-e2e-error-panel',
          powEnabled: false,
          signingEnabled: false,
          encryptionEnabled: false
        };

        const publisher = new DignityP2P({
          nodeId: 'publisher',
          networkAdapter: new InMemoryNetworkAdapter(hub),
          security
        });
        const reader = new DignityP2P({
          nodeId: 'reader',
          networkAdapter: new InMemoryNetworkAdapter(hub),
          security
        });

        await publisher.start();
        await reader.start();

        await publisher.joinPeerGroup('feed:browser-e2e-errors', {
          role: 'publisher',
          fanout: 2,
          domainEvents: true
        });

        const replica = new DignityQueryReplica(reader, {
          groupId: 'feed:browser-e2e-errors',
          collections: ['posts'],
          publisherId: 'publisher'
        });
        await replica.start({ bootstrapPeerIds: ['publisher'] });
        await new Promise((resolve) => setTimeout(resolve, 40));

        const manifest = validateDignityAppManifest({
          id: 'error-demo',
          title: 'Error demo',
          collections: ['posts']
        }).manifest;

        const mount = document.getElementById('host-mount');
        const host = new DignityAppHost({ manifest, replica, document });
        attachErrorPanel(host, mount);

        const appHtml = `<!doctype html><html><head><title>Err</title></head><body>
          <script>
            dignity.ready().then(function() {
              dignity.error('fixture runtime error', 'stack-line');
              throw new Error('uncaught iframe error');
            });
          <\/script>
        </body></html>`;

        host.mount(mount, appHtml);

        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('handshake timeout')), 12000);
          host.on('ready', () => {
            clearTimeout(timer);
            resolve();
          });
        });

        await new Promise((resolve) => setTimeout(resolve, 300));

        const errorPanel = mount.querySelector('.dignity-app-panel--errors');
        const visible = errorPanel && !errorPanel.hidden;
        document.getElementById('error-panel-visible').textContent = String(visible);
        document.getElementById('error-count').textContent = String(
          (errorPanel?.textContent || '').match(/App errors \((\d+)\)/)?.[1] || '0'
        );

        host.unmount();
        await replica.stop();
        await publisher.stop();
        await reader.stop();

        statusEl.textContent = 'ok';
      } catch (error) {
        fail(error?.message || String(error));
      }
    </script>
  </body>
</html>
